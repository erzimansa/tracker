<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер привычек</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Трекер">
<meta name="theme-color" content="#EEF1F4">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1B2433; --muted:#667085; --line:#DCE1E8; --sub:#F5F7F9;
  --accent:#2F5D8A; --pos:#2E7D5B; --pos-soft:#D8EEE3; --neg:#B4553A; --onaccent:#FFFFFF;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --surface:#1A2230; --ink:#E7ECF2; --muted:#93A0B2; --line:#2A3445; --sub:#161D28;
    --accent:#8DB6DE; --pos:#6CC59C; --pos-soft:#1C3329; --neg:#E59479; --onaccent:#121821;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1A2230; --ink:#E7ECF2; --muted:#93A0B2; --line:#2A3445; --sub:#161D28;
  --accent:#8DB6DE; --pos:#6CC59C; --pos-soft:#1C3329; --neg:#E59479; --onaccent:#121821;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px}
h2{font-size:1.15rem;font-weight:600;margin:28px 0 10px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px}
input[type=number]{width:72px;height:40px;padding:0 8px;text-align:center;font-variant-numeric:tabular-nums}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 16px}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.navbtn:disabled{opacity:.35;cursor:default}
.datebar .lbl{text-align:center}
.datebar .lbl b{display:block;font-size:1.05rem;font-weight:600}

/* rings */
.ring .arc{transition:stroke-dasharray .35s ease}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:2px;margin-bottom:12px}
.ringbtn{border:0;background:none;padding:8px 2px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ringbtn[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--gc)}
.ringbtn .rl{font-size:.7rem;hyphens:auto;-webkit-hyphens:auto;font-weight:500;color:var(--muted);text-align:center;line-height:1.15;word-break:break-word}
.ringbtn[aria-pressed="true"] .rl{color:var(--ink);font-weight:600}
.gpanel{border-radius:22px;padding:14px 12px 12px;background:var(--sub);background:color-mix(in srgb,var(--gc) 10%,var(--bg))}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 4px}
.ptitle b{font-size:1.2rem}
.sgh{display:flex;align-items:center;gap:10px;margin:16px 4px 2px;font-weight:600}
.sgh .muted{font-weight:400;font-size:.85rem}
.hcard{background:var(--surface);border-radius:16px;margin-top:8px;overflow:hidden}
.htop{display:flex;align-items:center}
.hmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 6px 10px 10px;text-align:left}
.hmain .nm{flex:1;min-width:0}
.tag{display:inline-block;margin-left:6px;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--sub);color:var(--muted);vertical-align:2px}
.info{flex:none;width:30px;height:30px;margin-right:12px;border-radius:50%;border:1.5px solid var(--gc);color:var(--gc);background:none;font-weight:700;font-size:.95rem;line-height:1}
.crit{background:var(--sub);padding:2px 14px 8px}
.citem{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);min-height:50px}
.citem:first-child{border-top:0}
.citem .cn{flex:1;font-size:.95rem}
.citem .cn small{display:block;color:var(--muted);font-size:.8rem}
button.citem{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
[aria-pressed="true"]>.check{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent))}
.anti [aria-pressed="true"]>.check{background:var(--neg);border-color:var(--neg)}
.check svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
[aria-pressed="true"]>.check svg{opacity:1}
.ratio{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem}
.ratio input{width:56px}
.antinote{font-size:.8rem;color:var(--muted);padding:8px 0 2px}

.daycard{background:var(--surface);border-radius:22px;overflow:hidden;--gc:var(--accent)}
.dayscore{display:flex;align-items:center;gap:16px;padding:16px}
.dayfac{padding:2px 16px 10px;background:var(--sub)}
textarea{width:100%;min-height:76px;padding:12px;resize:vertical}
.saved{height:20px;margin-top:10px;font-size:.85rem;color:var(--muted);text-align:center}

/* info sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .bd{position:absolute;inset:0;background:rgba(10,15,25,.45)}
.sheet .pn{position:relative;width:100%;max-width:560px;max-height:85%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--gc)}
.sheet .x{position:sticky;top:0;float:right;width:36px;height:36px;border-radius:50%;border:0;background:var(--sub);font-size:1.2rem}
.sheet h3{font-size:1.3rem;margin:4px 0 2px}
.sheet h4{font-size:.95rem;margin:18px 0 6px;color:var(--gc)}
.sheet ul{margin:0;padding-left:18px}
.sheet li{margin:5px 0}
.sheet .src li{font-size:.85rem;color:var(--muted)}
.sheet .disc{margin-top:18px;font-size:.8rem;color:var(--muted)}

/* stats */
.chartbox{background:var(--surface);border-radius:16px;padding:14px 10px 8px}
.chartbox svg{display:block;width:100%;height:auto}
.ins{background:var(--surface);border-radius:16px;overflow:hidden}
.irow{display:block;width:100%;border:0;background:none;text-align:left;padding:13px 16px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow.grp{background:var(--sub)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.delta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.pos{color:var(--pos)} .delta.neg{color:var(--neg)} .delta.zero{color:var(--muted)}
.track{position:relative;height:8px;margin:9px 0 6px;background:var(--bg);border-radius:4px}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0;border-radius:4px}
.fill.pos{left:50%;background:var(--pos)} .fill.neg{right:50%;background:var(--neg)}
.sub2{background:var(--sub);padding:2px 16px 8px 28px;border-top:1px solid var(--line)}
.sub2 .ihead{padding:8px 0 0;font-size:.9rem}
.top{border-radius:16px;padding:16px;margin:14px 0 4px;background:var(--pos-soft)}
.top p+p{margin-top:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;margin-top:14px}

/* editor */
.card{background:var(--surface);border-radius:16px;overflow:hidden}
.erow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .nm{flex:1}
.erow.g{background:var(--sub)}
.erow.g .nm{font-weight:600}
.link{border:0;background:none;color:var(--accent);padding:6px 2px;font-weight:500}
.link.danger{color:var(--neg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.primary{height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--onaccent);font-weight:600}
.ghost{height:46px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ghost.danger{color:var(--neg)}
.stack>*+*{margin-top:10px}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input:not([type=number]),.field select{width:100%;height:46px;padding:0 12px}
.cedit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.cedit .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
.cedit .row .field input[type=number]{width:80px}
.cedit select{height:40px;padding:0 8px}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;padding:12px 0 14px;font-size:.8rem;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1}
.nextp{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:-4px 0 14px;padding:10px 14px;border-radius:14px;border:0;background:var(--surface);font-size:.9rem;text-align:left}
.nextp b{font-weight:600}
.ptimes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 2px;padding:8px 6px;border-radius:12px;background:var(--surface);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:.92rem}
.ptimes small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.range{display:inline-block;margin-right:8px;padding:1px 7px;border-radius:7px;background:color-mix(in srgb,var(--gc) 14%,var(--surface));color:var(--ink);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums}
.hsub{display:block;font-size:.78rem;color:var(--muted);margin-top:1px}
.hsub.good{color:var(--pos)} .hsub.bad{color:var(--neg)}
.citem .cn small.bad{color:var(--neg)}
.hero{border-radius:20px;padding:16px;margin-bottom:6px}
.hero b{font-size:1.15rem}
.hero p{margin-top:6px}
.hero.bless{background:color-mix(in srgb,#B08A1E 14%,var(--surface))}
.hero.dawah{background:color-mix(in srgb,#2F9BB0 14%,var(--surface))}
.hero.fate{background:color-mix(in srgb,#7C5CC4 13%,var(--surface))}
.note{margin:-4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:#B08A1E;border-color:#B08A1E;color:#fff}
.chip.edit{padding-right:6px}
.chipx{border:0;background:var(--sub);width:24px;height:24px;border-radius:50%;line-height:1;color:var(--neg)}
.addchip{display:inline-flex;align-items:center;gap:4px}
.addchip input{height:40px;padding:0 12px;border-radius:999px;width:160px}
.lvl{display:flex;justify-content:space-between;align-items:baseline}
.lvl span{font-weight:600;color:var(--muted)}
.xpbar{height:10px;border-radius:5px;background:var(--surface);margin-top:10px;overflow:hidden}
.xpbar div{height:100%;background:#2F9BB0;border-radius:5px;transition:width .4s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3 div{background:var(--surface);border-radius:12px;padding:8px;text-align:center}
.stats3 b{display:block;font-size:1.05rem}
.stats3 span{font-size:.78rem;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .nm{flex:1}
.mrow .nm small{display:block;color:#2F9BB0;font-weight:600;font-size:.8rem}
.step{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1}
.step.plus{background:#2F9BB0;border-color:#2F9BB0;color:#fff}
.step:disabled{opacity:.35}
.cnt{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.quotes{margin-top:18px}
.quotes p{font-size:.86rem;color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}
.gcard{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:8px}
.gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.gcard input{width:100%;height:44px;padding:0 12px}
.adjrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.adj{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.adj input{width:100%}
.optrow{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.optrow input{width:20px;height:20px;margin-top:2px;flex:none}

.ringbtn .rs{font-size:.72rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:-4px}
.gic{vertical-align:-4px;margin-right:8px}
.icpick{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icpick[aria-pressed="true"]{border-color:var(--ink);background:var(--sub)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px}
.bdet{margin-top:10px;background:var(--surface);border-radius:16px;padding:12px}
.bq{font-size:.9rem;font-weight:600;margin-bottom:8px}
.chip.sm{padding:6px 11px;font-size:.88rem}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;height:42px;padding:0 12px}
.addrow .primary{height:42px;padding:0 14px}

nav button{font-size:.7rem}
.hdrr{display:flex;align-items:center;gap:8px}
.lvlchip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;border:0;background:#B08A1E;color:#fff;font-weight:700;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}
.toast b{font-size:1rem}.toast span{font-size:.82rem;opacity:.8}
.toast.show{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.herocard{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,#B08A1E 22%,var(--surface)),var(--surface));border-radius:22px;padding:18px;margin-top:6px}
.crest{position:relative;flex:none;width:76px;height:86px;background:#B08A1E;clip-path:polygon(50% 100%,0 72%,0 0,100% 0,100% 72%);display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.6rem;letter-spacing:.02em}
.crest span:first-child{margin-top:-10px}
.crestlv{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:.75rem;background:rgba(0,0,0,.25);border-radius:999px;padding:0 7px}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hinfo b{font-size:1.25rem}
.htitle{color:#B08A1E;font-weight:600}
.hinfo .xpbar{margin:6px 0 2px;background:var(--bg)}
.hinfo .xpbar div{background:#B08A1E}
.motto{margin:12px 4px 0;font-style:italic;color:var(--muted)}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.attrs div{background:var(--surface);border-radius:14px;padding:10px 12px}
.attrs span{display:block;font-size:.78rem;color:var(--muted)}
.attrs b{font-size:1.05rem}
.lrow{display:flex;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.chip.static{cursor:default}
.qrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.qrow:first-child{border-top:0}
.qrow .nm{flex:1}
.qrow .nm small{display:block;color:#B08A1E;font-weight:600;font-size:.8rem}
.qck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.qrow.done .qck{background:var(--pos);border-color:var(--pos)}
.qck svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.qrow.done .nm{color:var(--muted);text-decoration:line-through}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sktop{display:flex;justify-content:space-between;align-items:center}
.sklv{font-size:1.5rem;font-weight:700;color:var(--gc);font-variant-numeric:tabular-nums}
.skbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:4px 0 2px}
.skbar div{height:100%;background:var(--gc,#B08A1E);border-radius:3px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.ach svg{color:var(--line)}
.ach b{color:var(--ink);font-size:.95rem}
.ach span{font-size:.8rem}
.ach small{font-size:.75rem;font-variant-numeric:tabular-nums}
.ach.got{background:color-mix(in srgb,#B08A1E 16%,var(--surface))}
.ach.got svg{color:#B08A1E}

.info{width:22px;height:22px;margin-right:12px;border:1px solid var(--line);color:var(--muted);font-size:.72rem;font-weight:600;opacity:.85}
.sktier{font-size:.78rem;color:var(--gc);font-weight:600;margin-top:-2px}
.sklv{font-size:1.35rem}

.season{margin-top:8px;border-radius:22px;padding:16px;color:#fff;background:linear-gradient(140deg,#2A3E8C,#6B3FA0 60%,#B0457A)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sname{display:block;font-weight:700;font-size:1.15rem}
.sdates{font-size:.8rem;opacity:.8}
.sleft{font-size:.8rem;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;white-space:nowrap}
.slv{display:flex;align-items:center;gap:12px;margin-top:12px}
.slv b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.slv div{display:flex;flex-direction:column;font-size:.85rem}
.slv .muted{color:rgba(255,255,255,.75)}
.sbar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}

function frac(c,v){
  if(c.type==="negcheck")return v?0:1;
  if(v==null||v==="")return null;
  if(c.type==="scale5")return Math.max(0,Math.min(1,((+v)-1)/4));
  switch(c.type){
    case "check":return v?1:0;
    case "number":{const t=+c.target||1;return Math.max(0,Math.min(1,(+v)/t))}
    case "limit":{const g=+c.good,b=+c.bad;if(v<=g)return 1;if(v>=b)return 0;return (b-v)/(b-g)}

  }
  return null;
}

  const anyTrue=vals&&Object.values(vals).some(v=>v!==false&&v!=null);
  return {score:tot?s/tot*10:0,any:!!anyTrue};
}

  if(p.last&&p.last<k)return Math.round((d-fromKey(p.last))/864e5);

}
function personDue(h,p,k){const l=lastContact(h,p,k);return l==null||l>=(+p.every||1)}
function habitScore(h,e,k){
  const vals=e&&e.h&&e.h[h.id];
  if(h.type==="people"){
    const due=h.people.filter(p=>personDue(h,p,k));
    const done=h.people.filter(p=>vals&&isContact(vals[p.id]));
    if(!due.length)return done.length?10*Math.max(...done.map(p=>contactW(vals[p.id]))):null;

}

  const mx=P.reduce((a,p)=>a+p[0],0)/n,my=P.reduce((a,p)=>a+p[1],0)/n;
  let sxy=0,sxx=0,syy=0;P.forEach(([x,y])=>{const a=x-mx,b=y-my;sxy+=a*b;sxx+=a*a;syy+=b*b});
  if(sxx<1e-9||syy<1e-9)return null;return sxy/Math.sqrt(sxx*syy);

  if((m=t.match(/^цель: (.+)$/)))return (LANG==="en"?"target: ":"الهدف: ")+m[1];
  return str;
}
let i18nBusy=false;
function translateNode(root){
  if(LANG==="ru"||!root)return;i18nBusy=true;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);let n;
  while((n=tw.nextNode())){const v=n.nodeValue;if(!v||!v.trim())continue;const t=tr(v);if(t!==v)n.nodeValue=t}
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[aria-label]").forEach(e=>{["placeholder","aria-label"].forEach(a=>{const v=e.getAttribute(a);if(v){const t=tr(v);if(t!==v)e.setAttribute(a,t)}})});
  i18nBusy=false;
}
const mo=new MutationObserver(ms=>{if(i18nBusy||LANG==="ru")return;ms.forEach(m=>{m.addedNodes.forEach(nd=>{if(nd.nodeType===1)translateNode(nd);else if(nd.nodeType===3){const t=tr(nd.nodeValue);if(t!==nd.nodeValue){i18nBusy=true;nd.nodeValue=t;i18nBusy=false}}})})});
mo.observe(document.body,{childList:true,subtree:true});
const ACCENTS={blue:["#2F5D8A","#8DB6DE","Синий"],green:["#1F7A5C","#6CC59C","Изумрудный"],violet:["#5B4BB0","#A99BF0","Фиолетовый"],sand:["#8A6418","#D9B46A","Песочный"]};

  const a=ACCENTS[st.accent||"blue"]||ACCENTS.blue;r.style.setProperty("--accent",isDark()?a[1]:a[0]);
  r.style.fontSize=st.fontSize==="large"?"18px":"";
  r.lang=LANG==="ar"?"ar":LANG==="en"?"en":"ru";r.dir=LANG==="ar"?"rtl":"ltr";

function setLang(l){

  document.querySelectorAll("nav button span:not(.nbadge)").forEach(sp=>{sp.textContent=sp.dataset.ru});translateNode(document.querySelector("nav"));
}

  row("Язык",[["ru","Русский"],["en","English"],["ar","العربية"]],st.lang||"ru",k=>{setLang(k);openSettings()});

  if(LANG!=="ru")v.appendChild(el("p","hint",LANG==="en"?"The interface is translated; detailed texts (hadith summaries, advice, ideas) are still in Russian.":"تمت ترجمة الواجهة؛ النصوص التفصيلية (الأحاديث والنصائح والأفكار) ما زالت بالروسية."));
}
async function exportBackup(){
  const data=JSON.stringify(state,null,1);const name="habits-backup-"+key(today())+".json";
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast("Копия сохранена",name);return}catch(e){}}
  try{const f=new File([data],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});state.lastBackup=key(today());persist();return}catch(e){if(e&&e.name==="AbortError")return}}}catch(e){}
  openSheet("Резервная копия","Скопируйте текст и сохраните его в заметках или файле","var(--accent)",b=>{const t=el("textarea");t.value=data;t.rows=10;t.readOnly=true;b.appendChild(t);const c=el("button","primary","Скопировать");c.style.marginTop="10px";c.onclick=async()=>{try{await navigator.clipboard.writeText(data);c.textContent="Скопировано"}catch(e){t.select()}};b.appendChild(c)});
}
function importBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){alert("Файл не похож на резервную копию");return}
  if(!d||!Array.isArray(d.habits)||!d.entries){alert("В файле нет данных трекера");return}
  if(!confirm("Заменить текущие данные данными из копии?"))return;
  state=d;migrate(state);persist();applyAppearance();toast("Копия восстановлена");openSettings();
}
